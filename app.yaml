runtime: python27
api_version: 1
threadsafe: true
instance_class: F4_1G

handlers:
- url: /test_push/.*
  script: gae_test.app

- url: /cron/.*
  script: cron.app

- url: /.*
  script: main.app

# [START libraries]
libraries:
- name: pytz
  version: latest
- name: jinja2
  version: latest
- name: pycrypto
  version: "latest"
# [END libraries]

builtins:
- django_wsgi: on

# Search DEFAULT_SKIP_FILES in google.appengine.api.appinfo plus a few others
skip_files: |
    ^(.*/)?(
    (app\.yml)|
    (index\.yaml)|
    (index\.yml)|
    (#.*#)|
    (.*~)|
    (.*\.py[co])|
    (.*/RCS/.*)|
    (\..*)|
    (tests/.*)|
    (tools/.*)|
    (credentials/client_secret_service_account.json)|
    (cloud_sql_proxy)|
    ([A-Z]+(\.py)?)|
    (Makefile)|
    (.*\.rej)|
    (.*\.orig)|
    )$
