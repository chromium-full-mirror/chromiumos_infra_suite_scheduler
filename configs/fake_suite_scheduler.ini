[TestPerDay]
owner: ss-test
run_on: nightly
hour: 1
suite: av-analysis_per-day
branch_specs: ==tot
pool: cros_av_analysis
only_successful_build_required: True
# Exclude non-CrOS devices.
exclude_boards: whirlwind, gale
qs_account: unmanaged_p4

[TestPerBuild]
owner: ss-test
run_on: new_build
suite: av-analysis_per-build
branch_specs: ==tot
pool: cros_av_analysis
only_successful_build_required: True
# Exclude non-CrOS devices.
exclude_boards: whirlwind, gale
qs_account: unmanaged_p

[TestPerWeek]
owner: ss-test
run_on: weekly
day: 0
hour: 18
suite: av-analysis_per-week
branch_specs: ==tot
pool: cros_av_analysis
only_successful_build_required: True
# Exclude non-CrOS devices.
exclude_boards: whirlwind, gale
qs_account: unmanaged_p3


