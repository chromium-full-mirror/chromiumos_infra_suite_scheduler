# [begin cts]
# We define triggers (TimedEvents) for the following suites:
#
# 1) arc-cts:
#    - Kicks off 150-ish jobs per ABI (one for each module).
#    - Lots of autotest overhead, but robust against hangs/crashes.
#    - Easy for constables to watch in wmatrix.
#    - Usually 1% of jobs get lost in the lab, so not good for qualification.
# 2) arc-cts-qual:
#    - Kicks off 1 job per ABI.
#    - Less autotest overhead, but more memory usage on lab servers.
#    - Harder to watch in wmatrix but good for CTS dashboard.
#    - 98% reliable in the lab setting *if* image does not cause crashes.
# 3) arc-cts-unibuild:
#    - Run HW agnostics tests on fixed two models from all unibuild boards.
#    - dev:per-build, beta:per-build-every-alternate-day
#    - First short term implementation to reduce shard overload in the lab.
# 4) arc-cts-unibuild-hw:
#    - Run HW specific tests on all models of all unibuild boards.
#    - dev:per-build, beta:per-build-every-alternate-day
#    - First short term implementation to reduce shard overload in the lab.
################################################################################
