# When changing this file, you should validate your changes by running:
# python runner.py --test_type sanity
# after installing the prerequisites from infra/suite_scheduler/README.md
#
# Example suites:
# [Bluestreak]
#  The section name should be unique in this configuration.
# owner: [who should be contacted if this suite needs any changes]
# boards: [A list of the BUILD TARGETS for this suite to run,
#          separated by comma, e.g. kukui, grunt.]
#          ONLY [-kernelnext|-arcvm|-arc-r|-arc-r-userdebug] are legal suffixes
#          for boards.
#          Note, "foo-kernelnext" and "foo" are different build targets,
#          so you need to add "foo-kernelnext" to the board_list in
#          lab_config.ini, if you want to schedule suite on it.
# models: [A list of models for this suite to run, separated by comma.
#          The model name should follow the board name with underscore,
#          e.g. kukui_krane, grunt_treeya.]
#          Note, if "boards" is set, then only models belonging to these
#          boards can be added to "models".
#          Model is a hardware attribute, so you can consider that the board
#          prefix here means lab board. If the build target and lab board are
#          different due to the suffix, remove the suffix. Below example
#          schedules suites upon hatch-arc-r image for kohaku model.
#          ```
#          boards: hatch-arc-r
#          models: hatch_kohaku
#          ```
# exclude_boards: [A list of build targets for this suite to not run on.]
# exclude_models: [A list of models for this suite to not run on.]
# any_model: [Not specify the model in the suite test.]
#             If a uniboard has multiple models, job with `any_model: True`
#             only kicks off the suite on one model, which is decided at
#             run time.
# run_on: [specifying an event type: nightly, weekly, or new_build]
# day: [Only available if run_on==weekly, an integer between 0~6(0 is Monday)]
# hour: [Available if run_on==[nightly|weekly], an integer between 0~23]
#        Date and time in the suite scheduler are in MTV timezone.
# suite: [suite name to kick off]
# branch_specs: [limitations of branch builds on which the suite will
#                be kicked off, e.g. >=tot-2. The lag number supports
#                from tot-1 to tot-9.]
# pool: [pool name on which the suite will be kicked off]
# job_retry: True [whether to retry job if it fails]
# no_delay: True [whether to increase the priority of this suite]
# dimensions: [A list of labels attached to the test, e.g. label-wifi:foo]
#              label should be separated by ',', and each label consists
#              of key and value separated by ':'. Label 'build', 'label-pool',
#              'label-model' and 'suite' are reserved for CTP.
# priority: [Priority for swarming scheduling]
#            From 50 to 255, the lower one goes first. If qs_account is set,
#            priority will be ignored.
# qs_account: [Quota account]
#              `piority` is ignored when `qs_account` is set.
#              Check details at go/qs-enabled-pools.

