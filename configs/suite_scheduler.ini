################################################################################
# [begin cts]
# We define triggers (TimedEvents) for the following suites:
#
# 1) arc-cts:
#    - Kicks off 150-ish jobs per ABI (one for each module).
#    - Lots of autotest overhead, but robust against hangs/crashes.
#    - Easy for constables to watch in wmatrix.
#    - Usually 1% of jobs get lost in the lab, so not good for qualification.
# 2) arc-cts-qual, arc-cts-follower:
#    - Kicks off 1 job per ABI.
#    - Less autotest overhead, but more memory usage on lab servers.
#    - Harder to watch in wmatrix but good for CTS dashboard.
#    - 98% reliable in the lab setting *if* image does not cause crashes.
# 3) arc-cts-perbuild:
#    - Identical to arc-cts but targets pool:cts-perbuild for boards with high
#      availability like terra.

# Special suite to provide continuous coverage on selected boards.
[ArcCtsDevPerbuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-cts-perbuild
pool: cts-perbuild
branch_specs: ==tot
# No job_retry on dev perbuild to detect flaky regressions.
################################################################################
# [begin cts priority triggers]
# go/cts_pool_priority_management for detailed explanation

# Highest priority for qualication test on stable branch.
[ArcCtsQualStablePerBuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-cts-qual
pool: cts
branch_specs: ==tot-2
priority: 30
timeout: 168
force: True
only_hwtest_sanity_required: True
exclude_boards: grunt

# Highest priority for qualication test on stable branch.
# arc-cts-follower is expected to be triggered before arc-cts and arc-cts-qual.
[ArcCtsFollowerStablePerBuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-cts-follower
pool: cts
branch_specs: ==tot-2
priority: 35
timeout: 168
force: True
board_family: strago
only_hwtest_sanity_required: True
exclude_boards: grunt, cyan

# On stable run regression suite with retry.
[ArcCtsStablePerBuild]
owner: chromeos-test-team@google.com
run_on: new_build
