# When changing this file, you should validate your changes by running:
# TODO(xixuan): Change it to use local sanity check without dependencies
# From autotest.
# [autotest checkout]/site_utils/suite_scheduler/suite_scheduler.py \
#   modules/lab/files/autotest_cautotest/suite_scheduler.ini --sanity
#
# Example suites:
# [Bluestreak]
# owner: [who should be contacted if this suite needs any changes]
# run_on: [specifying an event type: nightly, weekly, or new_build]
# day: [Only available if run_on==weekly, an integer between 0~6]
# hour: [Only available if run_on==nightly, an integer between 0~23]
# suite: [suite name to kick off]
# branch_specs: [limitations of branch builds on which the suite will
#                be kicked off, e.g. >=tot-2]
# pool: [pool name on which the suite will be kicked off]
# job_retry: True [whether to retry job if it fails]
# no_delay: True [whether to increase the priority of this suite]

[Bluetooth_Qualification]
owner: chromeos-test-team@google.com
run_on: nightly
hour: 10
suite: bluetooth_qualification
branch_specs: ==tot
pool: wificell

[UsbDetect]
owner: chromeos-test-team@google.com
run_on: new_build
suite: usb_detect
branch_specs: >=tot-2
pool: usb_peripherals

