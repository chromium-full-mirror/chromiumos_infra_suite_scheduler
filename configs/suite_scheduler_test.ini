# [begin gts schedule]
# We define triggers (TimedEvents) for the following suites:
# 1) arc-gts:
#    - Runs about 35 jobs/modules to provide regression coverage.
# 2) arc-gts-perbuild:
#    - Special suite to provide continuous coverage on selected boards.
# 3) arc-gts-qual:
#    - Runs all everything in a single autotest job. Most efficient.
[ArcGtsPerbuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-gts-perbuild
pool: cts-perbuild
branch_specs: ==tot
# No job_retry on perbuild to detect flaky regressions.

# TODO(ihf): Change this to arc-gts-qual when b/36464569 fixed.
# Suite to qualify GTS for boards with small DUT allocations.
[ArcGtsSmallStablePerBuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-gts
pool: cts-small
branch_specs: ==tot-2
job_retry: True

# TODO(ihf): Change this to arc-gts-qual when b/36464569 fixed.
# Suite to qualify GTS for boards with medium DUT allocations.
[ArcGtsMediumStablePerBuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-gts
pool: cts-medium
branch_specs: ==tot-2
job_retry: True

[ArcGtsNightly]
owner: chromeos-test-team@google.com
run_on: nightly
hour: 14
suite: arc-gts
pool: cts
branch_specs: ==tot
# No job_retry on nightly to detect flaky regressions.

[ArcGtsBetaBranchPerBuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-gts
pool: cts
branch_specs: ==tot-1
job_retry: True

[ArcGtsStableBranchPerBuild]
