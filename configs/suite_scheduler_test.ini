################################################################################
# [begin cts]
# We define triggers (TimedEvents) for the following suites:
#
# 1) arc-cts:
#    - Kicks off 150-ish jobs per ABI (one for each module).
#    - Lots of autotest overhead, but robust against hangs/crashes.
#    - Easy for constables to watch in wmatrix.
#    - Usually 1% of jobs get lost in the lab, so not good for qualification.
# 2) arc-cts-qual:
#    - Kicks off 1 job per ABI.
#    - Less autotest overhead, but more memory usage on lab servers.
#    - Harder to watch in wmatrix but good for CTS dashboard.
#    - 98% reliable in the lab setting *if* image does not cause crashes.
# 3) arc-cts-perbuild:
#    - Identical to arc-cts but targets pool:cts-perbuild for boards with high
#      availability like terra.
# 4) arc-cts-[dev|beta]-[mon|tue|wed|thu|fri|sat|sun]:
#    - Identical to arc-cts but trigers on dev/beta channel on the indicated
#      day of the week. This allows gradual reduction of load due to regression
#      coverage.

# Special suite to provide continuous coverage on selected boards.
[ArcCtsDevPerbuild]
owner: chromeos-test-team@google.com
run_on: new_build
suite: arc-cts-perbuild
pool: cts-perbuild
branch_specs: ==tot
# No job_retry on dev perbuild to detect flaky regressions.
################################################################################
# [begin cts legacy]
# TODO(ihf): delete this section once we see the new suites below work and the
# ones here are not used on beta/stable branches anymore.
[ArcCtsNightly]
owner: chromeos-test-team@google.com
run_on: nightly
hour: 10
suite: arc-cts
pool: cts
branch_specs: ==tot
# No job_retry on nightly to detect flaky regressions.

